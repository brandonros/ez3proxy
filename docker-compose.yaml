services:
  3proxy:
    image: 3proxy/3proxy:latest
    ports:
      - "3128:3128"
      - "1080:1080"
    volumes:
      - ./config:/usr/local/3proxy/conf
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3128"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
